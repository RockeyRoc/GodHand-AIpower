<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GodHand · AoiAWD 行为监测</title>
<style>
:root{font:15px "Microsoft YaHei",sans-serif;color:#dce4f1;background:#101724}body{margin:0}header{padding:24px 32px;background:#192336;display:flex;align-items:center;gap:22px}h1{font-size:23px;margin:0}small{color:#9bacc4}main{padding:24px 32px}nav{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit;background:#202d43;color:#dce4f1;border:1px solid #3b4c68;border-radius:6px;padding:9px 14px;cursor:pointer}button.active{background:#087e78;border-color:#22bdac}input{cursor:text;min-width:230px}section{margin-top:18px}table{width:100%;border-collapse:collapse;background:#172133}th,td{text-align:left;padding:12px;border-bottom:1px solid #2b3850;word-break:break-all;max-width:400px}th{color:#9bacc4}tbody tr{cursor:pointer}tbody tr:hover{background:#23334c}.bar{display:flex;gap:10px;align-items:center;margin:18px 0}.muted{color:#9bacc4}dialog{background:#172133;color:#dce4f1;border:1px solid #456;width:min(1000px,85vw);max-height:80vh;border-radius:10px}pre{white-space:pre-wrap;word-break:break-all;font:14px Consolas,monospace}.error{color:#ff8d8d}
</style>
<header><h1>GodHand · AoiAWD</h1><small id="target"></small><small>Windows 原生监测 · SSH 加密回传</small></header>
<main><nav id="tabs"></nav><div class="bar"><button id="refresh">刷新</button><label><input id="auto" type="checkbox" style="min-width:0" checked> 自动刷新</label><input id="filter" placeholder="筛选当前页"><button id="export">导出当前页</button><span id="status" class="muted"></span></div>
<table><thead id="head"></thead><tbody id="rows"></tbody></table><div class="bar"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button><button id="latest">最新一页</button></div>
<p class="muted">点击记录查看详情。文件与进程仅展示探针权限范围；PHP 记录的响应最多保留 1 MiB。服务断开期间不补录历史事件。</p></main>
<dialog id="detail"><button id="close">关闭</button><pre id="body"></pre></dialog>
<script>
'use strict';
const token='__AOI_ACCESS_TOKEN__', label='__AOI_TARGET_NAME__';
document.querySelector('#target').textContent=label;
const views={Web:['ListWeb',['time','method','uri','remote']],文件:['ListFilesystem',['time','oper','path','size']],进程:['ListProcess',['time','pid','ppid','uid','user','bin','arg']],PWN:['ListPWN',['time','bin','stdin','stdout']],告警:['ListAlert',['time','type','plugin','message']]};
let selected='Web',page=0,last=1,items=[],busy=false;
const $=s=>document.querySelector(s), labels={time:'时间',method:'方法',uri:'请求路径',remote:'来源',oper:'操作',path:'文件',size:'大小',pid:'PID',ppid:'父 PID',uid:'UID',user:'用户',bin:'程序',arg:'参数',stdin:'输入',stdout:'输出',type:'类别',plugin:'规则',message:'告警'};
async function api(action,args={}){const response=await fetch('/api/v1/'+action+'?'+new URLSearchParams(args),{headers:{token}});if(!response.ok)throw Error('监测服务返回 '+response.status);return response.json()}
function cell(row,key){const value=row[key];return typeof value==='object'?JSON.stringify(value):String(value??'')}
function render(){const keys=views[selected][1];$('#head').replaceChildren();const h=document.createElement('tr');for(const k of keys){const c=document.createElement('th');c.textContent=labels[k]||k;h.append(c)}$('#head').append(h);$('#rows').replaceChildren();for(const row of items){if($('#filter').value&&!JSON.stringify(row).toLowerCase().includes($('#filter').value.toLowerCase()))continue;const tr=document.createElement('tr');for(const key of keys){const td=document.createElement('td');td.textContent=cell(row,key);tr.append(td)}tr.onclick=()=>detail(row);$('#rows').append(tr)}$('#page').textContent='第 '+(page||last)+' / '+last+' 页';$('#prev').disabled=(page||last)<=1;$('#next').disabled=(page||last)>=last}
async function load(){if(busy)return;busy=true;try{const data=await api(views[selected][0],{page,count:50});items=data.data||[];last=data.last_page||1;render();$('#status').textContent='更新于 '+new Date().toLocaleTimeString();$('#status').className='muted'}catch(error){$('#status').textContent=error.message;$('#status').className='error'}finally{busy=false}}
async function detail(row){try{let data=row;if(selected==='Web')data=await api('WebDetail',{id:row.id});if(selected==='PWN')data=await api('PWNDetail',{id:row.id});$('#body').textContent=JSON.stringify(data,null,2);$('#detail').showModal()}catch(error){$('#status').textContent=error.message}}
for(const name of Object.keys(views)){const button=document.createElement('button');button.textContent=name;button.className=name===selected?'active':'';button.onclick=()=>{selected=name;page=0;for(const b of $('#tabs').children)b.className=b===button?'active':'';load()};$('#tabs').append(button)}
$('#refresh').onclick=load;$('#filter').oninput=render;$('#prev').onclick=()=>{page=Math.max(1,(page||last)-1);load()};$('#next').onclick=()=>{page=Math.min(last,(page||last)+1);load()};$('#latest').onclick=()=>{page=0;load()};$('#close').onclick=()=>$('#detail').close();$('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(items,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='GodHand-AoiAWD-'+selected+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};setInterval(()=>{if($('#auto').checked&&!$('#detail').open)load()},3000);load();
</script></html>
